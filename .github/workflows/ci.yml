name: Build Windows

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: simumic/pom.xml
      - name: Registrar versão do Java
        shell: pwsh
        run: java -version
      - name: Testar e gerar pacote portátil
        shell: pwsh
        run: .\scripts\package-windows.ps1 -PackageType portable
      - uses: actions/upload-artifact@v4
        with:
          name: ProjetoArq-windows-x64
          path: dist/ProjetoArq-*-windows-x64.zip
          if-no-files-found: error
